[project]
name = "meridian"
version = "0.1.0"
description = "Walk-forward daily equity forecast pipeline"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2",
  "pandas>=2",
  "pyarrow>=18",
  "scikit-learn>=1.5",
  "yfinance>=0.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meridian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
